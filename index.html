<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGB Day Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef0f3;
  --surface:#ffffff;
  --surface-2:#f6f7f9;
  --line:#e0e4ea;
  --line-strong:#cdd3dc;
  --ink:#1a2029;
  --ink-2:#455163;
  --muted:#6b7788;
  --faint:#95a0b0;
  --accent:#d9741f;         /* muted hi-vis amber */
  --accent-ink:#a8560f;
  --accent-soft:#fbeadb;
  --blue:#2f5d9e;           /* blueprint */
  --blue-soft:#e6edf7;
  --slate:#5c6675;
  --slate-soft:#eaedf1;
  --good:#2f8f5b;
  --good-soft:#e3f2ea;
  --shadow:0 1px 2px rgba(20,30,45,.05),0 6px 18px rgba(20,30,45,.06);
  --shadow-lg:0 10px 40px rgba(20,30,45,.16);
  --radius:14px;
  --radius-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161c;
    --surface:#1a2028;
    --surface-2:#20272f;
    --line:#2b333d;
    --line-strong:#3a444f;
    --ink:#eef1f5;
    --ink-2:#c1c9d4;
    --muted:#8b96a4;
    --faint:#6a7683;
    --accent:#eb8a37;
    --accent-ink:#f2a862;
    --accent-soft:#3a2a17;
    --blue:#5f92d8;
    --blue-soft:#1c2a3d;
    --slate:#93a0af;
    --slate-soft:#252c34;
    --good:#4bb37e;
    --good-soft:#173026;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
    --shadow-lg:0 12px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#12161c;
  --surface:#1a2028;
  --surface-2:#20272f;
  --line:#2b333d;
  --line-strong:#3a444f;
  --ink:#eef1f5;
  --ink-2:#c1c9d4;
  --muted:#8b96a4;
  --faint:#6a7683;
  --accent:#eb8a37;
  --accent-ink:#f2a862;
  --accent-soft:#3a2a17;
  --blue:#5f92d8;
  --blue-soft:#1c2a3d;
  --slate:#93a0af;
  --slate-soft:#252c34;
  --good:#4bb37e;
  --good-soft:#173026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  --shadow-lg:0 12px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:120px;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--ground) 86%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:760px;margin:0 auto;padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(150deg,var(--accent),var(--accent-ink));
  display:grid;place-items:center;color:#fff;font-weight:700;
  font-family:"IBM Plex Mono";font-size:15px;letter-spacing:-.5px;
  box-shadow:0 2px 6px rgba(217,116,31,.35);
}
.brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-family:"IBM Plex Mono"}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;
  transition:.15s;
}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* ---------- date strip ---------- */
.datebar{max-width:760px;margin:0 auto;padding:18px 18px 4px;display:flex;align-items:flex-end;gap:14px}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:grid;place-items:center;transition:.15s;
}
.datenav button:hover{border-color:var(--line-strong);color:var(--ink)}
.datenav svg{width:16px;height:16px}
.datetitle{flex:1;min-width:0}
.datetitle .day{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.05}
.datetitle .full{font-size:12.5px;color:var(--muted);font-family:"IBM Plex Mono";margin-top:3px;letter-spacing:.02em}
.today-pill{
  font-size:11px;font-family:"IBM Plex Mono";letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  padding:3px 8px;border-radius:20px;margin-left:8px;vertical-align:3px;
}
.todaybtn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:9px;transition:.15s;
}
.todaybtn:hover{border-color:var(--line-strong);color:var(--ink)}
.todaybtn[hidden]{display:none}

/* ---------- layout ---------- */
main{max-width:760px;margin:0 auto;padding:8px 18px 40px}
.section-label{
  display:flex;align-items:center;gap:8px;margin:22px 2px 10px;
  font-family:"IBM Plex Mono";font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.section-label .count{color:var(--faint)}
.section-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- top 3 zone ---------- */
.top3{
  background:linear-gradient(180deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 30%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line));
  border-radius:var(--radius);padding:6px 6px 8px;box-shadow:var(--shadow);
}
.top3-head{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.top3-head .t{font-weight:700;font-size:14px;letter-spacing:.01em}
.top3-head .badge{
  font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#fff;background:var(--accent);padding:2px 7px;border-radius:6px;
}
.top3-head .hint{margin-left:auto;font-size:11.5px;color:var(--accent-ink);opacity:.8}
.slot-empty{
  display:flex;align-items:center;gap:10px;margin:4px 6px;padding:11px 12px;border-radius:var(--radius-sm);
  border:1.5px dashed color-mix(in srgb,var(--accent) 35%,var(--line));
  color:var(--accent-ink);font-size:13.5px;background:color-mix(in srgb,var(--surface) 55%,transparent);
}
.slot-empty .n{font-family:"IBM Plex Mono";font-weight:600;opacity:.7}

/* ---------- task card ---------- */
.task{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 10px 11px 12px;margin:7px 0;box-shadow:var(--shadow);
  transition:border-color .15s, opacity .2s, transform .12s;
  position:relative;
}
.top3 .task{margin:6px;}
.task.dragover{border-color:var(--accent);transform:translateY(-1px)}
.task .pbar{position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px}
.task[data-pri="1"] .pbar{background:var(--accent)}
.task[data-pri="2"] .pbar{background:var(--blue)}
.task[data-pri="3"] .pbar{background:var(--slate)}
.check{
  flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;
  border:2px solid var(--line-strong);background:var(--surface);
  display:grid;place-items:center;transition:.15s;
}
.check:hover{border-color:var(--accent)}
.check svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.15s;color:#fff}
.body{flex:1;min-width:0}
.title-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.title{font-size:15px;font-weight:500;line-height:1.35;word-break:break-word;outline:none;border-radius:5px}
.title[contenteditable="true"]{background:var(--surface-2);box-shadow:0 0 0 2px var(--accent-soft)}
.meta{display:flex;align-items:center;gap:7px;margin-top:5px;flex-wrap:wrap}
.chip{
  font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.06em;
  padding:2px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-weight:500;
}
.chip.pri1{color:var(--accent-ink);background:var(--accent-soft)}
.chip.pri2{color:var(--blue);background:var(--blue-soft)}
.chip.pri3{color:var(--slate);background:var(--slate-soft)}
.chip.recur{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.chip.carried{color:var(--blue);background:var(--blue-soft)}
.chip svg{width:11px;height:11px}
.rowbtn{
  flex:none;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--faint);display:grid;place-items:center;transition:.15s;
}
.rowbtn:hover{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.rowbtn svg{width:16px;height:16px}
.grip{cursor:grab;color:var(--faint);touch-action:none}
.grip:active{cursor:grabbing}

/* done state */
.task.done{opacity:.62}
.task.done .check{background:var(--good);border-color:var(--good)}
.task.done .check svg{opacity:1;transform:scale(1)}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done .pbar{opacity:.4}

/* empty / done group */
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:14px}
.empty .big{font-size:15px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.donehead{cursor:pointer;user-select:none}
.donehead .chev{transition:.2s;display:inline-block}
.donehead.collapsed .chev{transform:rotate(-90deg)}

/* ---------- add bar ---------- */
.addwrap{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
}
.addbar{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.addrow{display:flex;gap:9px;align-items:center}
.addinput{
  flex:1;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:11px;padding:13px 14px;font-size:15px;transition:.15s;
}
.addinput::placeholder{color:var(--faint)}
.addinput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.addbtn{
  flex:none;border:none;border-radius:11px;padding:0 18px;height:48px;
  background:var(--accent);color:#fff;font-weight:600;font-size:15px;
  display:flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 2px 8px rgba(217,116,31,.35);
}
.addbtn:hover{background:var(--accent-ink)}
.addbtn svg{width:17px;height:17px}
.opts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{
  border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;
  padding:6px 10px;border-radius:7px;transition:.12s;font-family:"IBM Plex Mono";letter-spacing:.02em;
}
.seg button.on[data-pri="1"]{background:var(--accent);color:#fff}
.seg button.on[data-pri="2"]{background:var(--blue);color:#fff}
.seg button.on[data-pri="3"]{background:var(--slate);color:#fff}
.selwrap{position:relative}
.recsel{
  appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  font-family:"IBM Plex Mono";font-size:12px;font-weight:500;padding:8px 28px 8px 11px;border-radius:9px;
}
.selwrap::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;font-size:11px}
.top3toggle{
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  font-size:12px;font-weight:600;padding:8px 11px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;transition:.12s;
}
.top3toggle svg{width:13px;height:13px}
.top3toggle.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-ink)}

/* ---------- menu ---------- */
.menu{
  position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:210px;
  animation:pop .12s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  border:none;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;
  padding:9px 10px;border-radius:8px;transition:.1s;
}
.menu button:hover{background:var(--surface-2);color:var(--ink)}
.menu button svg{width:16px;height:16px;flex:none;color:var(--muted)}
.menu button:hover svg{color:var(--ink-2)}
.menu button.danger{color:#c0492f}
.menu button.danger svg{color:#c0492f}
.menu .sep{height:1px;background:var(--line);margin:5px 4px}
.menu .subhead{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:7px 10px 3px}
.menu .acctline{padding:0 10px 7px;font-size:12.5px;color:var(--ink-2);word-break:break-all}
.menu .prirow{display:flex;gap:6px;padding:2px 6px 6px}
.menu .prirow button{flex:1;justify-content:center;padding:7px 0;border:1px solid var(--line);font-family:"IBM Plex Mono";font-size:11px}
.menu .prirow button[data-p="1"].sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.menu .prirow button[data-p="2"].sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.menu .prirow button[data-p="3"].sel{background:var(--slate);color:#fff;border-color:var(--slate)}

.scrim{position:fixed;inset:0;z-index:55;background:transparent}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--ground);padding:11px 14px;border-radius:11px;
  display:flex;align-items:center;gap:14px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.22s;z-index:70;max-width:90vw;
}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:transparent;border:none;color:var(--accent);font-weight:700;font-size:13.5px;font-family:inherit}

/* banner */
.banner{
  max-width:760px;margin:10px auto 0;padding:10px 14px;border-radius:11px;
  display:flex;align-items:flex-start;gap:10px;font-size:12.5px;line-height:1.4;
  color:var(--accent-ink);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
}
.banner svg{width:16px;height:16px;flex:none;margin-top:1px}
.banner[hidden]{display:none}

/* sync dot */
.syncdot{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-family:"IBM Plex Mono";
  border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:8px;transition:.15s;white-space:nowrap}
.syncdot:hover{border-color:var(--line);background:var(--surface)}
.syncdot .d{width:7px;height:7px;border-radius:50%;background:var(--faint);transition:.3s}
.syncdot.ok .d{background:var(--good)}
.syncdot.saving .d{background:var(--accent);animation:pulse 1s infinite}
.syncdot.local .d{background:var(--blue)}
@keyframes pulse{50%{opacity:.35}}

/* sign-in gate */
.gate{position:fixed;inset:0;z-index:200;background:var(--ground);display:grid;place-items:center;padding:24px}
.gate[hidden]{display:none}
.gate-card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);
  padding:30px 28px;max-width:440px;width:100%;text-align:center;
}
.gate-mark{width:52px;height:52px;border-radius:13px;margin:0 auto 16px;font-size:19px}
.gate-card h2{margin:0 0 8px;font-size:21px;font-weight:700;letter-spacing:-.3px}
.gate-card p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
.ms-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:600;padding:13px 16px;border-radius:11px;transition:.15s;
}
.ms-btn:hover{border-color:var(--accent);background:var(--surface-2)}
.ms-btn .ms-logo{width:19px;height:19px;flex:none}
.gate-field{text-align:left;margin:0 0 12px}
.gate-field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 5px;font-family:"IBM Plex Mono";letter-spacing:.02em}
.gate-field input{
  width:100%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:11px 12px;font-size:14px;font-family:"IBM Plex Mono";
}
.gate-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gate-redirect{
  background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;
  padding:10px 12px;margin:0 0 16px;text-align:left;
}
.gate-redirect .lbl{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono";letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.gate-redirect .val{font-size:12.5px;font-family:"IBM Plex Mono";color:var(--ink);word-break:break-all;line-height:1.5}
.gate-redirect .copy{margin-top:8px;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:8px;padding:6px 10px}
.gate-primary{
  width:100%;border:none;border-radius:11px;padding:13px 16px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(217,116,31,.35);margin-top:4px;transition:.15s;
}
.gate-primary:hover{background:var(--accent-ink)}
.gate-err{color:#c0492f;font-size:13px;margin:12px 0 0;line-height:1.5}
.gate-help{margin-top:16px;font-size:12.5px;color:var(--muted)}
.gate-help a{color:var(--accent-ink)}

@media (max-width:520px){
  .datetitle .day{font-size:22px}
  .brand .full-sub{display:none}
  main{padding-left:14px;padding-right:14px}
  .datebar{padding-left:14px;padding-right:14px}
  .opts{gap:6px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="mark">SGB</div>
      <div>
        <h1>Day Book</h1>
        <div class="sub full-sub">Daily site diary</div>
      </div>
    </div>
    <button class="syncdot" id="syncdot" title="Tap to sync now"><span class="d"></span><span class="lbl" id="synclbl">Local</span></button>
    <button class="iconbtn" id="menubtn" title="Backup & sync" aria-label="Backup and sync">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
    <button class="iconbtn" id="themebtn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg id="themeicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div>

<div class="banner" id="banner" hidden>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"></script>
<script>
"use strict";
/* ============================================================
   SGB Day Book — daily diary / task manager
   Persistence: artifact capability (cross-device) + localStorage
   ============================================================ */

const LS_KEY = "sgb_daybook_v1";
const DATA_FILE = "data.json";

/* ---------- date helpers ---------- */
const pad = n => String(n).padStart(2,"0");
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return ymd(new Date()); }
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function nowISO(){ return new Date().toISOString(); }
function uid(){ return "t"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------- state ---------- */
// task: {id,title,date,done,doneAt,pri(1..3),top3,recurId,carriedFrom,order,createdAt,updatedAt,removed,removedAt}
// recur rule: {id,title,pri,top3,freq,weekday,monthday,startDate,createdAt,updatedAt,ended}
let state = { tasks:{}, recurs:{}, v:1 };
let viewDate = todayStr();
let compose = { pri:1, recur:"none", top3:false };
let doneCollapsed = false;

/* ---------- persistence ---------- */
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const p=JSON.parse(raw); if(p&&p.tasks) return p; } }catch(e){}
  return null;
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

// ---- Microsoft 365 sync ----
const CFG_KEY = "sgb_daybook_cfg";
const SCOPES = ["User.Read","Files.ReadWrite"];
const GRAPH_FILE = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/daybook.json:/content";
let cfg = null;                  // {clientId, tenantId}
let pca = null, account = null, graphToken = null;
let online = false;              // signed in AND able to reach Graph
let syncTimer = null;
let pendingSync = false;
let lastSyncedAt = 0;

function redirectUri(){ return location.origin + location.pathname; }
function loadCfg(){ try{ const r=localStorage.getItem(CFG_KEY); if(r) return JSON.parse(r); }catch(e){} return null; }
function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function setSync(cls,label){
  const el=document.getElementById("syncdot");
  el.className="syncdot "+cls;
  document.getElementById("synclbl").textContent=label;
}
function showBanner(on){
  const b=document.getElementById("banner");
  if(on){ b.hidden=false; } else { b.hidden=true; }
}

// merge two states, last-write-wins per record by updatedAt
function mergeState(a,b){
  const out={tasks:{},recurs:{},v:1};
  for(const key of ["tasks","recurs"]){
    const ids=new Set([...Object.keys(a[key]||{}),...Object.keys(b[key]||{})]);
    for(const id of ids){
      const x=a[key][id], y=b[key][id];
      if(!x){ out[key][id]=y; continue; }
      if(!y){ out[key][id]=x; continue; }
      out[key][id]= (new Date(y.updatedAt||0) > new Date(x.updatedAt||0)) ? y : x;
    }
  }
  return out;
}

// ---- auth ----
async function initAuth(){
  cfg = loadCfg();
  if(!cfg || !cfg.clientId || !cfg.tenantId){ showGateSetup(); return; }
  try{
    pca = new msal.PublicClientApplication({
      auth:{ clientId:cfg.clientId, authority:"https://login.microsoftonline.com/"+cfg.tenantId, redirectUri:redirectUri() },
      cache:{ cacheLocation:"localStorage" }
    });
    await pca.initialize();
    const resp = await pca.handleRedirectPromise();
    account = (resp && resp.account) || pca.getAllAccounts()[0] || null;
    if(!account){ showGateSignin(); return; }
    pca.setActiveAccount(account);
    hideGate(); setAccountUI();
    await connect();
  }catch(e){ showGateError(e && e.message ? e.message : String(e)); }
}
async function ensureToken(){
  const r = await pca.acquireTokenSilent({scopes:SCOPES, account});
  graphToken = r.accessToken; return graphToken;
}
async function connect(){
  setSync("saving","Connecting…");
  try{
    await ensureToken();
    online = true;
    const pulled = await pullRemote();
    lastSyncedAt=Date.now(); setSync("ok","Synced "+hhmm()); showBanner(false);
    if(pulled>0) toast("Pulled "+pulled+" item"+(pulled>1?"s":"")+" from OneDrive.");
    // push anything created offline before sign-in
    scheduleSync();
  }catch(e){
    if(e && (e.errorCode==="interaction_required"||e.errorCode==="login_required"||e.errorCode==="consent_required")){
      try{ await pca.acquireTokenRedirect({scopes:SCOPES}); }catch(_){}
      return;
    }
    online=false; setSync("local","Offline — saved here"); showBanner(true);
  }
}
function signOut(){ if(pca && account){ pca.logoutRedirect({account}); } }

// ---- Graph read/write ----
async function graphGet(){
  let r = await fetch(GRAPH_FILE, {headers:{Authorization:"Bearer "+graphToken}});
  if(r.status===401){ await ensureToken(); r = await fetch(GRAPH_FILE, {headers:{Authorization:"Bearer "+graphToken}}); }
  if(r.status===404) return null;
  if(!r.ok) throw new Error("Graph GET "+r.status);
  return await r.json();
}
async function graphPut(obj){
  const body = JSON.stringify(obj);
  let r = await fetch(GRAPH_FILE, {method:"PUT", headers:{Authorization:"Bearer "+graphToken,"Content-Type":"application/json"}, body});
  if(r.status===401){ await ensureToken(); r = await fetch(GRAPH_FILE, {method:"PUT", headers:{Authorization:"Bearer "+graphToken,"Content-Type":"application/json"}, body}); }
  if(!r.ok) throw new Error("Graph PUT "+r.status);
  return true;
}

async function pullRemote(){
  if(!online) return 0;
  try{
    const remote = await graphGet();
    if(!remote || !remote.tasks) return 0;
    const before=new Set(Object.keys(state.tasks));
    state = mergeState(state, remote);
    let pulled=0;
    for(const id of Object.keys(state.tasks)) if(!before.has(id) && !state.tasks[id].removed) pulled++;
    rollover(); saveLocal(); render();
    return pulled;
  }catch(e){ online=false; setSync("local","Offline — saved here"); showBanner(true); return 0; }
}

function scheduleSync(){
  saveLocal();
  if(!online){ return; }
  pendingSync=true;
  setSync("saving","Saving…");
  clearTimeout(syncTimer);
  syncTimer=setTimeout(runSync, 700);
}

async function runSync(){
  if(!online || !pendingSync) return;
  pendingSync=false;
  try{
    await graphPut(state);
    lastSyncedAt=Date.now(); setSync("ok","Synced "+hhmm()); showBanner(false);
  }catch(err){
    // keep the work locally; retry shortly
    online=false; setSync("local","Offline — saved here"); showBanner(true);
    pendingSync=true; clearTimeout(syncTimer); syncTimer=setTimeout(async()=>{ try{ await ensureToken(); online=true; }catch(_){}; runSync(); }, 6000);
  }
}

// Force any pending change up immediately (before the app is hidden / closed).
function flushNow(){ if(online && pendingSync){ clearTimeout(syncTimer); runSync(); } }

// Manual "Sync now": reconnect if needed, pull, then push.
async function manualSync(){
  if(!pca || !account){ toast("Sign in to sync — tap Sign out / in from the menu."); return; }
  setSync("saving","Syncing…");
  try{ await ensureToken(); online=true; showBanner(false); }catch(e){ online=false; setSync("local","Offline — saved here"); showBanner(true); toast("Couldn't reach Microsoft 365 — still saved here."); return; }
  const pulled = await pullRemote();
  try{
    await graphPut(state); lastSyncedAt=Date.now(); setSync("ok","Synced "+hhmm());
    toast(pulled>0 ? ("Pulled "+pulled+" item"+(pulled>1?"s":"")+" in.") : "Up to date.");
  }catch(e){ online=false; setSync("local","Offline — saved here"); showBanner(true); }
}

// ---- sign-in gate UI ----
const MS_LOGO='<svg class="ms-logo" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>';
function gateEl(){ return document.getElementById("gate"); }
function hideGate(){ gateEl().hidden=true; }
function showGate(){ gateEl().hidden=false; }
function setGate(title,msg,bodyHTML){
  document.getElementById("gateTitle").textContent=title;
  document.getElementById("gateMsg").textContent=msg;
  document.getElementById("gateBody").innerHTML=bodyHTML;
  showGate();
}
function showGateSignin(){
  setGate("SGB Day Book","Sign in with your SGB Microsoft 365 account to sync your diary across every device.",
    `<button class="ms-btn" id="signinBtn">${MS_LOGO}Sign in with Microsoft</button>
     <div class="gate-help"><a href="#" id="reconfigLink">Change Microsoft 365 settings</a></div>`);
  document.getElementById("signinBtn").addEventListener("click",()=>{ try{ pca.loginRedirect({scopes:SCOPES}); }catch(e){ showGateError(e.message); } });
  document.getElementById("reconfigLink").addEventListener("click",e=>{ e.preventDefault(); showGateSetup(); });
}
function showGateSetup(){
  const c = loadCfg() || {};
  setGate("Connect to Microsoft 365","Paste the two IDs from your Entra app registration. These are identifiers, not passwords.",
    `<div class="gate-redirect">
       <div class="lbl">Redirect URI — add this exact value to your Entra app (Single-page application)</div>
       <div class="val" id="redirectVal">${redirectUri()}</div>
       <button class="copy" id="copyRedirect">Copy</button>
     </div>
     <div class="gate-field"><label>Application (client) ID</label><input id="cfgClient" placeholder="00000000-0000-0000-0000-000000000000" value="${c.clientId||""}"></div>
     <div class="gate-field"><label>Directory (tenant) ID</label><input id="cfgTenant" placeholder="00000000-0000-0000-0000-000000000000" value="${c.tenantId||""}"></div>
     <button class="gate-primary" id="cfgSave">Save & continue</button>
     <div class="gate-err" id="cfgErr"></div>`);
  document.getElementById("copyRedirect").addEventListener("click",()=>{ navigator.clipboard&&navigator.clipboard.writeText(redirectUri()); document.getElementById("copyRedirect").textContent="Copied"; });
  document.getElementById("cfgSave").addEventListener("click",()=>{
    const clientId=document.getElementById("cfgClient").value.trim();
    const tenantId=document.getElementById("cfgTenant").value.trim();
    const gid=/^[0-9a-fA-F-]{30,40}$/;
    if(!gid.test(clientId)||!gid.test(tenantId)){ document.getElementById("cfgErr").textContent="Both IDs should look like 00000000-0000-0000-0000-000000000000."; return; }
    saveCfg({clientId,tenantId}); location.reload();
  });
}
function showGateError(msg){
  setGate("Something went wrong", "We couldn't finish signing you in.",
    `<div class="gate-err">${(msg||"").toString().slice(0,300)}</div>
     <button class="gate-primary" id="retryBtn" style="margin-top:14px">Try again</button>
     <div class="gate-help"><a href="#" id="reconfigLink2">Change Microsoft 365 settings</a></div>`);
  document.getElementById("retryBtn").addEventListener("click",()=>location.reload());
  document.getElementById("reconfigLink2").addEventListener("click",e=>{ e.preventDefault(); showGateSetup(); });
}
function setAccountUI(){ /* account shown in the app menu */ }

// ---- backup safety net ----
async function exportBackup(){
  const payload = JSON.stringify({app:"sgb-daybook",exportedAt:nowISO(),state}, null, 2);
  const filename = "sgb-daybook-backup-"+todayStr()+".json";
  try{
    const dl = await (window.claude && window.claude.use ? window.claude.use("downloads") : null);
    if(dl){ await dl.save({filename, data:payload}); toast("Backup saved."); return; }
  }catch(e){ if(e&&e.code==="declined"){ return; } }
  // fallback for plain-file / non-artifact contexts
  try{
    const blob=new Blob([payload],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved.");
  }catch(e){ toast("Couldn't export here — try from your desktop browser."); }
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      const incoming=parsed.state||parsed;
      if(!incoming||!incoming.tasks) throw new Error("bad");
      state=mergeState(state,incoming);
      saveLocal(); rollover(); render(); scheduleSync();
      toast("Backup restored and merged.");
    }catch(e){ toast("That file didn't look like a Day Book backup."); }
  };
  r.readAsText(file);
}

/* ---------- recurring generation ---------- */
function recurMatches(rule, dateStr){
  if(rule.ended) return false;
  if(rule.startDate && dateStr < rule.startDate) return false;
  const d=parseYmd(dateStr); const dow=d.getDay();
  switch(rule.freq){
    case "daily": return true;
    case "weekdays": return dow>=1 && dow<=5;
    case "weekly": return dow===(rule.weekday??parseYmd(rule.startDate).getDay());
    case "monthly": return d.getDate()===(rule.monthday??parseYmd(rule.startDate).getDate());
  }
  return false;
}
function ensureRecurInstances(dateStr){
  for(const rule of Object.values(state.recurs)){
    if(!recurMatches(rule,dateStr)) continue;
    const instId = "r_"+rule.id+"_"+dateStr;
    if(!state.tasks[instId]){
      state.tasks[instId]={
        id:instId, title:rule.title, date:dateStr, done:false, doneAt:null,
        pri:rule.pri, top3:!!rule.top3, recurId:rule.id, carriedFrom:null,
        order:Date.now()+Math.random(), createdAt:nowISO(), updatedAt:nowISO(), removed:false
      };
    }
  }
}

/* ---------- carry-over ---------- */
// Move all incomplete, non-recurring, non-removed tasks dated before today → today.
function rollover(){
  const t=todayStr(); let moved=0;
  for(const task of Object.values(state.tasks)){
    if(task.removed) continue;
    if(task.recurId) continue;            // recurring regenerate on their own schedule
    if(task.done) continue;
    if(task.date < t){
      if(!task.carriedFrom) task.carriedFrom=task.date;
      task.date=t; task.updatedAt=nowISO(); moved++;
    }
  }
  return moved;
}

/* ---------- queries ---------- */
function tasksForDay(dateStr){
  ensureRecurInstances(dateStr);
  return Object.values(state.tasks).filter(x=>!x.removed && x.date===dateStr);
}

/* ---------- rendering ---------- */
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 5.9 21.4l1.4-6.8L2.2 9.9l6.9-.8z"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
};
const PRINAME={1:"Must do",2:"Important",3:"If time"};
const RECURNAME={daily:"Daily",weekdays:"Weekdays",weekly:"Weekly",monthly:"Monthly"};

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function taskEl(task){
  const el=document.createElement("div");
  el.className="task"+(task.done?" done":"");
  el.dataset.id=task.id; el.dataset.pri=task.pri;
  el.setAttribute("draggable","false");
  const chips=[];
  chips.push(`<span class="chip pri${task.pri}">${PRINAME[task.pri]}</span>`);
  if(task.recurId){ const r=state.recurs[task.recurId]; chips.push(`<span class="chip recur">${ICON.repeat}${r?RECURNAME[r.freq]||"Repeats":"Repeats"}</span>`); }
  if(task.carriedFrom && !task.done){ const d=parseYmd(task.carriedFrom); chips.push(`<span class="chip carried" title="Carried forward from ${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}">${ICON.arrow}carried</span>`); }
  el.innerHTML=`
    <span class="pbar"></span>
    <button class="check" data-act="toggle" aria-label="Complete">${ICON.check}</button>
    <div class="body">
      <div class="title-line"><span class="title" data-act="edit" tabindex="0">${esc(task.title)}</span></div>
      <div class="meta">${chips.join("")}</div>
    </div>
    <button class="rowbtn grip" data-act="drag" aria-label="Reorder" title="Drag to reorder">${ICON.grip}</button>
    <button class="rowbtn" data-act="menu" aria-label="More options">${ICON.dots}</button>`;
  return el;
}

function render(){
  const t=todayStr();
  document.getElementById("todaybtn").hidden = (viewDate===t);
  // header
  const d=parseYmd(viewDate);
  let dayLabel;
  if(viewDate===t) dayLabel="Today";
  else if(viewDate===addDays(t,-1)) dayLabel="Yesterday";
  else if(viewDate===addDays(t,1)) dayLabel="Tomorrow";
  else dayLabel=DOW[d.getDay()];
  document.getElementById("dayLabel").innerHTML = esc(dayLabel) + (viewDate===t?'<span class="today-pill">today</span>':"");
  document.getElementById("fullDate").textContent = `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;

  const all=tasksForDay(viewDate);
  const active=all.filter(x=>!x.done);
  const done=all.filter(x=>x.done);
  const top3=active.filter(x=>x.top3).sort(byOrder);
  const rest=active.filter(x=>!x.top3).sort(byPriThenOrder);

  const main=document.getElementById("main");
  main.innerHTML="";

  // top 3 zone
  const t3=document.createElement("div");
  t3.className="top3";
  t3.innerHTML=`<div class="top3-head"><span class="badge">Top 3</span><span class="t">Must-do today</span><span class="hint">${top3.length}/3 set</span></div>`;
  const t3list=document.createElement("div"); t3list.id="top3list";
  top3.slice(0,3).forEach(tk=>t3list.appendChild(taskEl(tk)));
  for(let i=top3.length;i<3;i++){
    const s=document.createElement("div"); s.className="slot-empty";
    s.innerHTML=`<span class="n mono">${i+1}</span><span>Set your #${i+1} must-do — tap the ⋯ on any task and choose “Make top-3”.</span>`;
    t3list.appendChild(s);
  }
  t3.appendChild(t3list);
  main.appendChild(t3);

  // rest of day
  const lbl=document.createElement("div"); lbl.className="section-label";
  lbl.innerHTML=`Everything else <span class="count">${rest.length}</span>`;
  main.appendChild(lbl);
  const restList=document.createElement("div"); restList.id="restlist";
  if(rest.length===0 && top3.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML=`<div class="big">Nothing on the books for ${viewDate===t?"today":"this day"}.</div>Add your first task below. Anything you don't finish rolls forward automatically.`;
    restList.appendChild(e);
  } else if(rest.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML=`Just your top-3 today. Keep it tight.`;
    restList.appendChild(e);
  }
  rest.forEach(tk=>restList.appendChild(taskEl(tk)));
  main.appendChild(restList);

  // done group
  if(done.length){
    const dh=document.createElement("div");
    dh.className="section-label donehead"+(doneCollapsed?" collapsed":"");
    dh.innerHTML=`<span class="chev">${ICON.chev}</span> Done <span class="count">${done.length}</span>`;
    dh.addEventListener("click",()=>{ doneCollapsed=!doneCollapsed; render(); });
    main.appendChild(dh);
    if(!doneCollapsed){
      const dl=document.createElement("div");
      done.sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||"")).forEach(tk=>dl.appendChild(taskEl(tk)));
      main.appendChild(dl);
    }
  }
  enableDrag(t3list,"top3");
  enableDrag(restList,"rest");
}
function byOrder(a,b){ return (a.order||0)-(b.order||0); }
function byPriThenOrder(a,b){ return a.pri-b.pri || (a.order||0)-(b.order||0); }

/* ---------- actions ---------- */
function getTask(id){ return state.tasks[id]; }
function touch(task){ task.updatedAt=nowISO(); }

function toggleDone(id){
  const t=getTask(id); if(!t) return;
  t.done=!t.done; t.doneAt=t.done?nowISO():null; touch(t);
  scheduleSync(); render();
}
function setPriority(id,p){
  const t=getTask(id); if(!t) return; t.pri=p; touch(t);
  if(t.recurId && state.recurs[t.recurId]){ state.recurs[t.recurId].pri=p; touch(state.recurs[t.recurId]); }
  scheduleSync(); render();
}
function toggleTop3(id){
  const t=getTask(id); if(!t) return;
  if(!t.top3){
    const cur=tasksForDay(viewDate).filter(x=>!x.done&&x.top3).length;
    if(cur>=3){ toast("Top-3 is full — clear one first."); return; }
  }
  t.top3=!t.top3; touch(t); scheduleSync(); render();
}
function moveToDay(id,dateStr){
  const t=getTask(id); if(!t) return;
  t.date=dateStr; t.carriedFrom=null; touch(t); scheduleSync(); render();
  toast("Moved to "+humanDay(dateStr));
}
function humanDay(s){ const t=todayStr(); if(s===t)return"today"; if(s===addDays(t,1))return"tomorrow"; const d=parseYmd(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }

function duplicateTask(id){
  const t=getTask(id); if(!t) return;
  const n={...t,id:uid(),done:false,doneAt:null,recurId:null,carriedFrom:null,order:Date.now(),createdAt:nowISO(),updatedAt:nowISO()};
  state.tasks[n.id]=n; scheduleSync(); render();
}
let lastRemoved=null;
function removeTask(id){
  const t=getTask(id); if(!t) return;
  t.removed=true; t.removedAt=nowISO(); touch(t);
  // if recurring instance, also end the rule? no — only removes this instance. To stop series use menu.
  lastRemoved=id; scheduleSync(); render();
  toast("Task removed.", "Undo", ()=>{ const x=getTask(id); if(x){x.removed=false;touch(x);scheduleSync();render();} });
}
function stopSeries(id){
  const t=getTask(id); if(!t||!t.recurId) return;
  const r=state.recurs[t.recurId]; if(r){ r.ended=true; r.endedDate=viewDate; touch(r); }
  toast("Future repeats stopped.");
  scheduleSync(); render();
}

/* ---------- add ---------- */
function addTask(){
  const inp=document.getElementById("addinput");
  const title=inp.value.trim(); if(!title) return;
  if(compose.recur!=="none"){
    // create a recurring rule + instance for the viewed day
    const rid="r"+uid();
    const d=parseYmd(viewDate);
    state.recurs[rid]={ id:rid, title, pri:compose.pri, top3:compose.top3, freq:compose.recur,
      weekday:d.getDay(), monthday:d.getDate(), startDate:viewDate, createdAt:nowISO(), updatedAt:nowISO(), ended:false };
  } else {
    const id=uid();
    state.tasks[id]={ id, title, date:viewDate, done:false, doneAt:null, pri:compose.pri,
      top3:compose.top3 && (tasksForDay(viewDate).filter(x=>!x.done&&x.top3).length<3),
      recurId:null, carriedFrom:null, order:Date.now(), createdAt:nowISO(), updatedAt:nowISO(), removed:false };
  }
  inp.value=""; compose.top3=false; syncComposeUI();
  scheduleSync(); render();
  inp.focus();
}

/* ---------- calendar (Outlook deeplink) ---------- */
function addToOutlook(id){
  const t=getTask(id); if(!t) return;
  const d=parseYmd(t.date); d.setHours(9,0,0,0);
  const end=new Date(d.getTime()+30*60000);
  const fmt=x=>x.toISOString();
  const url="https://outlook.office.com/calendar/0/deeplink/compose?"+
    "path=/calendar/action/compose&rru=addevent"+
    "&subject="+encodeURIComponent(t.title)+
    "&startdt="+encodeURIComponent(fmt(d))+
    "&enddt="+encodeURIComponent(fmt(end))+
    "&body="+encodeURIComponent("Added from SGB Day Book");
  window.open(url,"_blank","noopener");
  toast("Opening Outlook — pick your time and save.");
}

/* ---------- context menu ---------- */
let menuEl=null, scrimEl=null;
function closeMenu(){ if(menuEl){menuEl.remove();menuEl=null;} if(scrimEl){scrimEl.remove();scrimEl=null;} }
function openMenu(id,anchor){
  closeMenu();
  const t=getTask(id); if(!t) return;
  scrimEl=document.createElement("div"); scrimEl.className="scrim";
  scrimEl.addEventListener("click",closeMenu); document.body.appendChild(scrimEl);
  menuEl=document.createElement("div"); menuEl.className="menu";
  const isTop3=t.top3;
  menuEl.innerHTML=`
    <div class="subhead">Priority</div>
    <div class="prirow">
      <button data-p="1" class="${t.pri===1?'sel':''}">P1</button>
      <button data-p="2" class="${t.pri===2?'sel':''}">P2</button>
      <button data-p="3" class="${t.pri===3?'sel':''}">P3</button>
    </div>
    <div class="sep"></div>
    <button data-m="top3">${ICON.star}${isTop3?"Remove from top-3":"Make top-3"}</button>
    <button data-m="cal">${ICON.cal}Add to Outlook Calendar</button>
    <button data-m="tomorrow">${ICON.arrow}Move to tomorrow</button>
    <button data-m="edit">${ICON.edit}Rename</button>
    <button data-m="dup">${ICON.copy}Duplicate</button>
    ${t.recurId?`<div class="sep"></div><button data-m="stopseries">${ICON.repeat}Stop future repeats</button>`:""}
    <div class="sep"></div>
    <button class="danger" data-m="remove">${ICON.trash}Remove</button>`;
  document.body.appendChild(menuEl);
  const r=anchor.getBoundingClientRect();
  let top=r.bottom+6, left=r.right-menuEl.offsetWidth;
  if(left<8) left=8;
  if(top+menuEl.offsetHeight>window.innerHeight-8) top=r.top-menuEl.offsetHeight-6;
  menuEl.style.top=Math.max(8,top)+"px"; menuEl.style.left=left+"px";
  menuEl.querySelectorAll(".prirow button").forEach(b=>b.addEventListener("click",()=>{ setPriority(id,+b.dataset.p); closeMenu(); }));
  menuEl.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{
    const m=b.dataset.m; closeMenu();
    if(m==="top3") toggleTop3(id);
    else if(m==="cal") addToOutlook(id);
    else if(m==="tomorrow") moveToDay(id, addDays(viewDate,1));
    else if(m==="edit") startEdit(id);
    else if(m==="dup") duplicateTask(id);
    else if(m==="stopseries") stopSeries(id);
    else if(m==="remove") removeTask(id);
  }));
}

/* ---------- inline edit ---------- */
function startEdit(id){
  const el=document.querySelector(`.task[data-id="${id}"] .title`);
  if(!el) return;
  el.setAttribute("contenteditable","true"); el.focus();
  const range=document.createRange(); range.selectNodeContents(el);
  const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const finish=(save)=>{
    el.removeAttribute("contenteditable");
    el.removeEventListener("blur",onBlur); el.removeEventListener("keydown",onKey);
    const t=getTask(id);
    if(save && t){ const v=el.textContent.trim(); if(v){ t.title=v; touch(t);
      if(t.recurId&&state.recurs[t.recurId]){ state.recurs[t.recurId].title=v; touch(state.recurs[t.recurId]); }
      scheduleSync(); } }
    render();
  };
  const onBlur=()=>finish(true);
  const onKey=(e)=>{ if(e.key==="Enter"){e.preventDefault();finish(true);} else if(e.key==="Escape"){e.preventDefault();finish(false);} };
  el.addEventListener("blur",onBlur); el.addEventListener("keydown",onKey);
}

/* ---------- drag reorder (pointer based) ---------- */
let drag=null;
function enableDrag(container,zone){
  if(!container) return;
  container.querySelectorAll(".task").forEach(row=>{
    const handle=row.querySelector('[data-act="drag"]');
    if(!handle) return;
    handle.addEventListener("pointerdown",e=>{
      e.preventDefault();
      const id=row.dataset.id;
      drag={id,zone,container,row,startY:e.clientY};
      row.style.opacity=".5";
      window.addEventListener("pointermove",onDragMove);
      window.addEventListener("pointerup",onDragUp,{once:true});
    });
  });
}
function onDragMove(e){
  if(!drag) return;
  const rows=[...drag.container.querySelectorAll(".task")];
  let after=null;
  for(const r of rows){
    if(r===drag.row) continue;
    const box=r.getBoundingClientRect();
    if(e.clientY < box.top+box.height/2){ after=r; break; }
  }
  drag.container.querySelectorAll(".task").forEach(r=>r.classList.remove("dragover"));
  if(after) drag.container.insertBefore(drag.row, after);
  else drag.container.appendChild(drag.row);
}
function onDragUp(){
  if(!drag) return;
  window.removeEventListener("pointermove",onDragMove);
  drag.row.style.opacity="";
  // commit new order from DOM
  const rows=[...drag.container.querySelectorAll(".task")];
  let base=Date.now();
  rows.forEach((r,i)=>{ const t=getTask(r.dataset.id); if(t){ t.order=base+i; touch(t); } });
  drag=null; scheduleSync(); render();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg,btnLabel,onClick){
  const el=document.getElementById("toast"), b=document.getElementById("toastbtn");
  document.getElementById("toastmsg").textContent=msg;
  if(btnLabel){ b.hidden=false; b.textContent=btnLabel; b.onclick=()=>{ el.classList.remove("show"); onClick&&onClick(); }; }
  else b.hidden=true;
  el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"), btnLabel?6000:2600);
}

/* ---------- compose UI ---------- */
function syncComposeUI(){
  document.querySelectorAll("#priseg button").forEach(b=>b.classList.toggle("on",+b.dataset.pri===compose.pri));
  document.getElementById("recsel").value=compose.recur;
  document.getElementById("top3toggle").classList.toggle("on",compose.top3);
}

/* ---------- theme ---------- */
function initTheme(){
  let saved=null; try{ saved=localStorage.getItem("sgb_theme"); }catch(e){}
  if(saved) document.documentElement.setAttribute("data-theme",saved);
  updateThemeIcon();
}
function updateThemeIcon(){
  const dark = document.documentElement.getAttribute("data-theme")==="dark" ||
    (!document.documentElement.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.getElementById("themeicon").innerHTML = dark
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const next=dark?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem("sgb_theme",next); }catch(e){}
  updateThemeIcon();
}

/* ---------- events ---------- */
document.getElementById("main").addEventListener("click",e=>{
  const row=e.target.closest(".task"); if(!row) return;
  const actEl=e.target.closest("[data-act]"); if(!actEl) return;
  const id=row.dataset.id, act=actEl.dataset.act;
  if(act==="toggle") toggleDone(id);
  else if(act==="menu") openMenu(id,actEl);
  else if(act==="edit") startEdit(id);
});
document.getElementById("addbtn").addEventListener("click",addTask);
document.getElementById("addinput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); });
document.getElementById("priseg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; compose.pri=+b.dataset.pri; syncComposeUI(); });
document.getElementById("recsel").addEventListener("change",e=>{ compose.recur=e.target.value; });
document.getElementById("top3toggle").addEventListener("click",()=>{ compose.top3=!compose.top3; syncComposeUI(); });
document.getElementById("prevday").addEventListener("click",()=>{ viewDate=addDays(viewDate,-1); doneCollapsed=false; render(); });
document.getElementById("nextday").addEventListener("click",()=>{ viewDate=addDays(viewDate,1); doneCollapsed=false; render(); });
document.getElementById("todaybtn").addEventListener("click",()=>{ viewDate=todayStr(); rollover(); doneCollapsed=false; scheduleSync(); render(); });
document.getElementById("themebtn").addEventListener("click",toggleTheme);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",updateThemeIcon);
window.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMenu(); });

// sync + backup controls
document.getElementById("syncdot").addEventListener("click",manualSync);
document.getElementById("menubtn").addEventListener("click",e=>openAppMenu(e.currentTarget));
document.getElementById("importfile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) importBackup(f); e.target.value=""; });

function openAppMenu(anchor){
  closeMenu();
  scrimEl=document.createElement("div"); scrimEl.className="scrim";
  scrimEl.addEventListener("click",closeMenu); document.body.appendChild(scrimEl);
  menuEl=document.createElement("div"); menuEl.className="menu";
  const acct = account ? (account.username || account.name || "") : "";
  menuEl.innerHTML=`
    ${acct?`<div class="subhead">Signed in</div><div class="acctline">${esc(acct)}</div><div class="sep"></div>`:""}
    <button data-a="sync">${ICON.repeat}Sync now</button>
    <div class="sep"></div>
    <button data-a="export">${ICON.cal}Export backup (.json)</button>
    <button data-a="import">${ICON.copy}Restore from backup</button>
    ${account?`<div class="sep"></div><button data-a="signout">${ICON.arrow}Sign out</button>`:""}`;
  document.body.appendChild(menuEl);
  const r=anchor.getBoundingClientRect();
  let left=r.right-menuEl.offsetWidth; if(left<8) left=8;
  menuEl.style.top=(r.bottom+6)+"px"; menuEl.style.left=left+"px";
  menuEl.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.a; closeMenu();
    if(a==="sync") manualSync();
    else if(a==="export") exportBackup();
    else if(a==="import") document.getElementById("importfile").click();
    else if(a==="signout") signOut();
  }));
}

// re-check rollover when tab regains focus; flush pending changes before it hides
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ flushNow(); return; }
  const m=rollover(); if(m){ render(); scheduleSync(); }
  if(online) pullRemote().then(p=>{ if(p>0) toast("Pulled "+p+" item"+(p>1?"s":"")+" from OneDrive."); });
});
window.addEventListener("pagehide",flushNow);
window.addEventListener("beforeunload",flushNow);

/* ---------- boot ---------- */
(function boot(){
  initTheme();
  const local=loadLocal();
  if(local) state=local;
  if(!state.tasks) state.tasks={};
  if(!state.recurs) state.recurs={};
  rollover();
  saveLocal();
  syncComposeUI();
  render();
  initAuth();
})();
</script>
